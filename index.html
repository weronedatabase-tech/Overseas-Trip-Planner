<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overseas Trip Planner</title>
    <style>
        /* Reset margins and ensure the body takes up the full viewport */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevent double scrollbars */
            background-color: #f3f4f6; /* Matches the app's gray-100 theme */
        }
        
        /* Make the iframe fill the entire screen seamlessly */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- The iframe pointing to your published AI Studio app -->
    <iframe 
        src="https://overseas-trip-planner.ai.studio" 
        allow="fullscreen; clipboard-read; clipboard-write; camera; microphone; geolocation" 
        title="Overseas Trip Planner">
    </iframe>
</body>
</html>
